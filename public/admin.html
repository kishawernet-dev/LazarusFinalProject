<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazarus Station 7 Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    table{width:100%;border-collapse:collapse;background:#f7f5ee;color:#111;margin-top:16px}th,td{border:1px solid #999;padding:8px;vertical-align:top;font-size:13px}th{background:#b9e24f}.wide{overflow-x:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar input{max-width:360px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Project Lazarus Station 7 Teacher Dashboard</h1>
      <p>Enter the teacher password from your Netlify environment variables.</p>
      <div class="toolbar">
        <div><label for="password">Teacher Password</label><input id="password" type="password"></div>
        <button id="loadBtn">Load Submissions</button><button id="csvBtn">Download CSV</button>
      </div><div id="status" class="status"></div>
    </div>
    <div class="card"><h2>Submissions</h2><div class="wide"><table id="table"><thead></thead><tbody></tbody></table></div></div>
  </div>
<script>
let rows=[];
function csvEscape(value){return '"'+String(value??"").replaceAll('"','""')+'"'}
function flatten(record){return{submittedAt:record.submittedAt,groupName:record.groupName,period:record.period,projectId:record.projectId,productType:record.productType,productLink:record.productLink,members:record.members,outbreakDiagnosis:record.responses?.outbreakDiagnosis,ecosystemDamage:record.responses?.ecosystemDamage,restorationBlueprint:record.responses?.restorationBlueprint,diagnosisLeadDefense:record.responses?.defense1,ecologyLeadDefense:record.responses?.defense2,restorationLeadDefense:record.responses?.defense3,commandEditorDefense:record.responses?.defense4,diagnosisScore:record.evaluation?.diagnosisScore,ecosystemScore:record.evaluation?.ecosystemScore,blueprintScore:record.evaluation?.blueprintScore,reasoningScore:record.evaluation?.reasoningScore,individualDefenseScore:record.evaluation?.individualDefenseScore,suggestedTotal:record.suggestedTotal,completionCheck:record.evaluation?.completionCheck,evidenceStrength:record.evaluation?.evidenceStrength,missingEvidence:record.evaluation?.missingEvidence,misconceptions:record.evaluation?.misconceptions,needsTeacherReview:record.evaluation?.needsTeacherReview,saplingScore:record.aiDetection?.score,aiRiskLevel:record.aiDetection?.riskLevel,aiDetectorNotes:record.aiDetection?.notes}}
async function load(){const password=document.getElementById("password").value;document.getElementById("status").textContent="Loading...";const response=await fetch("/.netlify/functions/admin",{headers:{"x-admin-password":password}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Failed to load.");rows=data.submissions.map(flatten);renderTable();document.getElementById("status").textContent=`Loaded ${rows.length} submissions.`}
function renderTable(){const headers=["submittedAt","groupName","period","productType","productLink","members","suggestedTotal","saplingScore","aiRiskLevel","needsTeacherReview","missingEvidence","misconceptions"];document.querySelector("#table thead").innerHTML="<tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";document.querySelector("#table tbody").innerHTML=rows.map(row=>"<tr>"+headers.map(h=>`<td>${String(row[h]??"").replaceAll("<","&lt;")}</td>`).join("")+"</tr>").join("")}
function downloadCsv(){if(!rows.length)return;const headers=Object.keys(rows[0]);const csv=[headers.join(",")].concat(rows.map(row=>headers.map(h=>csvEscape(row[h])).join(","))).join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="lazarus_station7_submissions.csv";a.click();URL.revokeObjectURL(url)}
document.getElementById("loadBtn").addEventListener("click",()=>load().catch(err=>document.getElementById("status").textContent=err.message));document.getElementById("csvBtn").addEventListener("click",downloadCsv);
</script>
</body>
</html>
